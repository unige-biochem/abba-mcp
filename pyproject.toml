[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abba-fiji"
version = "0.24.1"
description = "ABBA (Aligning Big Brains and Atlases) in Fiji, for AI assistants: MCP server, pinned environment and docs"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
    "jgo[cli]>=3.1",
]

[project.scripts]
abba-fiji = "abba_fiji:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"abba_fiji" = ["fiji_tools.json", "env/*", "data/**/*"]
